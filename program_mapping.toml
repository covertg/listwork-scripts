# This file contains a mapping from the Colllege's nomenclature to our own acronyms in
# Broadstripes. The left-hand side is the boss' terminology (after a bit of cleanup,
# e.g. removing the word "PROGRAM"). The right-hand side is a combination of program and
# degree type. They are somewhat organized by category, but the order in this file
# doesn't matter for the functioning of the script parse_employer_bu.py. Newlines also
# do not matter.

# Format:
# "ORIGINAL VALUE" = ["PROGRAM", "DEGREE TYPE"]

